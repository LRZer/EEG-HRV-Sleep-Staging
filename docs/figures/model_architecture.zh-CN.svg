   <g id="text_1">
    <text style="fill: #20324a; font: 700 18px 'Microsoft YaHei'; text-anchor: start" x="16.38" y="30.204" transform="rotate(-0 16.38 30.204)">两级 Transformer：EEG 对照 A1 与完整融合 A6</text>
   </g>
   <g id="text_2">
    <text style="fill: #52667f; font: 10px 'Microsoft YaHei'; text-anchor: start" x="16.38" y="54.0432" transform="rotate(-0 16.38 54.0432)">B：批大小；L=15（A0/A3/A4/A5 为 5）；尺寸包含当前及过去窗口</text>
   </g>
   <g id="text_3">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="76.365" y="108.66677" transform="rotate(-0 76.365 108.66677)">EEG 频谱</text>
   </g>
   <g id="text_4">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(54.907437 131.061526)">[B,L,29,89]</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(50.361687 143.800901)">30 s / epoch</text>
   </g>
   <g id="text_5">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="247.95" y="108.66677" transform="rotate(-0 247.95 108.66677)">窗口内编码</text>
   </g>
   <g id="text_6">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(185.598562 124.486276)">89→96 + positional encoding</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(187.393625 137.431213)">2-layer / 4-head Transformer</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(180.831437 150.376151)">Mean pool 29 frames → [B,L,96]</text>
   </g>
   <g id="text_7">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="457.2" y="108.66677" transform="rotate(-0 457.2 108.66677)">窗口间编码</text>
   </g>
   <g id="text_8">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(394.331562 124.538182)">[B,L,96] + positional encoding</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(396.643625 137.48312)">2-layer / 4-head Transformer</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(418.582437 150.27337)">Padding-key mask</text>
   </g>
   <g id="text_9">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="655.29" y="108.66677" transform="rotate(-0 655.29 108.66677)">当前窗口分类</text>
   </g>
   <g id="text_10">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(620.4915 124.56362)">Last token [B,96]</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(592.505437 137.302995)">LayerNorm / Dropout / Linear</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(615.989062 150.247932)">5 logits → softmax</text>
   </g>
   <g id="text_11">
    <text style="fill: #0072b2; font: 700 11px 'Microsoft YaHei'; text-anchor: start" x="19.17" y="181.5552" transform="rotate(-0 19.17 181.5552)">A1：仅 EEG；309,029 参数；15 窗口</text>
   </g>
   <g id="text_12">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="76.365" y="262.784426" transform="rotate(-0 76.365 262.784426)">A6 双模态输入</text>
   </g>
   <g id="text_13">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(45.494875 287.116961)">EEG [B,L,29,89]</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(50.574125 299.856336)">HRV [B,L,55]</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(21.957625 312.750399)">26 values + 26 flags + 3 q</text>
   </g>
   <g id="text_14">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="247.95" y="232.96325" transform="rotate(-0 247.95 232.96325)">同一 EEG 编码定义</text>
   </g>
   <g id="text_15">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'; text-anchor: middle" x="247.95" y="252.635534" transform="rotate(-0 247.95 252.635534)">29×89 → 96 / epoch</text>
   </g>
   <g id="text_16">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="247.95" y="319.11701" transform="rotate(-0 247.95 319.11701)">心脏 MLP</text>
   </g>
   <g id="text_17">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(223.668875 336.965686)">55→96→96</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(178.294562 349.705061)">20% whole-context HRV dropout</text>
   </g>
   <g id="text_18">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="457.2" y="262.784426" transform="rotate(-0 457.2 262.784426)">质量约束残差门控</text>
   </g>
   <g id="text_19">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(391.4035 287.168868)">g = sigmoid(195→1) × q1 × q2</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(403.764062 299.959118)">z = EEG + g × delta(HRV)</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(441.96225 312.749368)">[B,L,96]</text>
   </g>
   <g id="text_20">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="655.29" y="262.784426" transform="rotate(-0 655.29 262.784426)">时序编码与分类</text>
   </g>
   <g id="text_21">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(596.012375 287.22043)">Same layer definitions as A1</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(597.302812 300.01068)">2 layers / 4 heads / 96 dims</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(609.93425 312.80093)">Current token → [B,5]</text>
   </g>
   <g id="text_22">
    <text style="fill: #52667f; font: 10px 'Microsoft YaHei'; text-anchor: start" x="19.17" y="386.6832" transform="rotate(-0 19.17 386.6832)">A6：342,921 参数；全缺失 HRV 时 g=0；使用 A6 自己的 EEG／时序权重</text>
   </g>
  </g>
 </g>
