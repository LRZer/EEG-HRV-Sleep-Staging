   <g id="text_1">
    <text style="fill: #20324a; font: 700 18px 'DejaVu Sans'; text-anchor: start" x="16.38" y="30.204" transform="rotate(-0 16.38 30.204)">Two-level Transformer: EEG control A1 and full fusion A6</text>
   </g>
   <g id="text_2">
    <text style="fill: #52667f; font: 10px 'DejaVu Sans'; text-anchor: start" x="16.38" y="54.0432" transform="rotate(-0 16.38 54.0432)">B: batch size; L=15 (5 for A0/A3/A4/A5); contexts include current and past epochs</text>
   </g>
   <g id="text_3">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="76.365" y="108.672239" transform="rotate(-0 76.365 108.672239)">EEG spectra</text>
   </g>
   <g id="text_4">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(52.068062 131.505995)">[B,L,29,89]</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(49.39575 143.366057)">30 s / epoch</text>
   </g>
   <g id="text_5">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="247.95" y="108.672239" transform="rotate(-0 247.95 108.672239)">Within-epoch encoder</text>
   </g>
   <g id="text_6">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(183.630937 125.575964)">89→96 + positional encoding</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(185.074687 137.436026)">2-layer / 4-head Transformer</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(177.644187 149.296088)">Mean pool 29 frames → [B,L,96]</text>
   </g>
   <g id="text_7">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="457.2" y="108.672239" transform="rotate(-0 457.2 108.672239)">Across-epoch encoder</text>
   </g>
   <g id="text_8">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(390.466437 125.575964)">[B,L,96] + positional encoding</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(394.324687 137.436026)">2-layer / 4-head Transformer</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(417.149687 149.296088)">Padding-key mask</text>
   </g>
   <g id="text_9">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="655.29" y="108.672239" transform="rotate(-0 655.29 108.672239)">Current-epoch head</text>
   </g>
   <g id="text_10">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(617.577187 125.575964)">Last token [B,96]</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(590.99775 137.436026)">LayerNorm / Dropout / Linear</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(614.893187 149.296088)">5 logits → softmax</text>
   </g>
   <g id="text_11">
    <text style="fill: #0072b2; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="19.17" y="181.5552" transform="rotate(-0 19.17 181.5552)">A1: EEG only; 309,029 parameters; 15 epochs</text>
   </g>
   <g id="text_12">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="76.365" y="262.789895" transform="rotate(-0 76.365 262.789895)">A6 inputs</text>
   </g>
   <g id="text_13">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(41.699875 288.103867)">EEG [B,L,29,89]</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(48.532937 299.96393)">HRV [B,L,55]</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(17.547312 311.823993)">26 values + 26 flags + 3 q</text>
   </g>
   <g id="text_14">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="247.95" y="232.968719" transform="rotate(-0 247.95 232.968719)">Same EEG encoder</text>
   </g>
   <g id="text_15">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'; text-anchor: middle" x="247.95" y="252.640346" transform="rotate(-0 247.95 252.640346)">29×89 → 96 / epoch</text>
   </g>
   <g id="text_16">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="247.95" y="319.122479" transform="rotate(-0 247.95 319.122479)">Cardiac MLP</text>
   </g>
   <g id="text_17">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(223.778875 337.410155)">55→96→96</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(176.465812 349.270217)">20% whole-context HRV dropout</text>
   </g>
   <g id="text_18">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="457.2" y="262.750833" transform="rotate(-0 457.2 262.750833)">Quality-constrained gate</text>
   </g>
   <g id="text_19">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(388.149563 288.103867)">g = sigmoid(195→1) × q1 × q2</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(399.96425 299.96393)">z = EEG + g × delta(HRV)</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(439.900438 311.823993)">[B,L,96]</text>
   </g>
   <g id="text_20">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="655.29" y="262.789895" transform="rotate(-0 655.29 262.789895)">Temporal encoder + head</text>
   </g>
   <g id="text_21">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(592.373437 288.103867)">Same layer definitions as A1</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(594.136188 299.96393)">2 layers / 4 heads / 96 dims</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(607.932937 311.823993)">Current token → [B,5]</text>
   </g>
   <g id="text_22">
    <text style="fill: #52667f; font: 10px 'DejaVu Sans'; text-anchor: start" x="19.17" y="386.6832" transform="rotate(-0 19.17 386.6832)">A6: 342,921 parameters; missing HRV forces g=0; fallback retains A6's own trained weights</text>
   </g>
  </g>
 </g>
