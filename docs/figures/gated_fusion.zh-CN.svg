   <g id="text_1">
    <text style="fill: #20324a; font: 700 17px 'Microsoft YaHei'; text-anchor: start" x="16.38" y="31.3128" transform="rotate(-0 16.38 31.3128)">残差门控：保留 EEG，按覆盖程度加入 HRV 修正</text>
   </g>
   <g id="text_2">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="81.945" y="122.244026" transform="rotate(-0 81.945 122.244026)">EEG 向量 e</text>
   </g>
   <g id="text_3">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'; text-anchor: middle" x="81.945" y="148.053517" transform="rotate(-0 81.945 148.053517)">96 values</text>
   </g>
   <g id="text_4">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="81.945" y="233.124026" transform="rotate(-0 81.945 233.124026)">心脏向量 h</text>
   </g>
   <g id="text_5">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'; text-anchor: middle" x="81.945" y="258.933517" transform="rotate(-0 81.945 258.933517)">55→96→96</text>
   </g>
   <g id="text_6">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="266.085" y="152.957786" transform="rotate(-0 266.085 152.957786)">可学习门控 u</text>
   </g>
   <g id="text_7">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(225.026125 170.548545)">[e,h,q] = 195 values</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(215.900937 183.28792)">Linear 195→1 / sigmoid</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(212.692375 196.07817)">Initial bias −2; u ≈ 0.1192</text>
   </g>
   <g id="text_8">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="266.085" y="294.108026" transform="rotate(-0 266.085 294.108026)">心脏修正 delta</text>
   </g>
   <g id="text_9">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(221.6615 313.54783)">Linear 96→96 / GELU</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(237.313125 326.287205)">Linear 96→96</text>
   </g>
   <g id="text_10">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="465.57" y="153.123411" transform="rotate(-0 465.57 153.123411)">有效权重 g</text>
   </g>
   <g id="text_11">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(431.650813 170.49767)">g = u × q1 × q2</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(434.386375 183.28792)">0 ≤ g ≤ q1×q2</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(426.01125 196.07817)">One scalar / epoch</text>
   </g>
   <g id="text_12">
    <text style="fill: #20324a; font: 700 10px 'Microsoft YaHei'; text-anchor: middle" x="645.525" y="152.957786" transform="rotate(-0 645.525 152.957786)">融合向量 z</text>
   </g>
   <g id="text_13">
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(609.893937 170.471201)">z = e + g × delta</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(625.993125 183.261451)">96 values</text>
    <text style="fill: #20324a; font: 8.8px 'Microsoft YaHei'" transform="translate(594.14675 196.155514)">→ temporal Transformer</text>
   </g>
   <g id="text_14">
    <text style="fill: #0072b2; font: 10px 'Microsoft YaHei'; text-anchor: middle" x="362.34" y="71.784" transform="rotate(-0 362.34 71.784)">EEG 主路径（残差）</text>
   </g>
   <g id="text_15">
    <text style="fill: #20324a; font: 9px 'Microsoft YaHei'" transform="translate(390.24 220.249012)">q1: valid RR fraction</text>
    <text style="fill: #20324a; font: 9px 'Microsoft YaHei'" transform="translate(390.24 234.166106)">q2: finite feature fraction</text>
    <text style="fill: #20324a; font: 9px 'Microsoft YaHei'" transform="translate(390.24 248.0832)">q3: history fraction (learned input only)</text>
   </g>
   <g id="text_16">
    <text style="fill: #52667f; font: 10px 'Microsoft YaHei'; text-anchor: start" x="390.24" y="335.124" transform="rotate(-0 390.24 335.124)">HRV 全缺失：值 0／标记 1／q=0 → g=0</text>
   </g>
  </g>
