   <g id="text_1">
    <text style="fill: #20324a; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="16.38" y="31.8672" transform="rotate(-0 16.38 31.8672)">Data pipeline: original signals to five-stage predictions</text>
   </g>
   <g id="text_2">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="74.97" y="91.757495" transform="rotate(-0 74.97 91.757495)">Raw EEG</text>
   </g>
   <g id="text_3">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'; text-anchor: middle" x="74.97" y="117.56633" transform="rotate(-0 74.97 117.56633)">1 channel / µV</text>
   </g>
   <g id="text_4">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="245.16" y="91.718432" transform="rotate(-0 245.16 91.718432)">Epoch-local processing</text>
   </g>
   <g id="text_5">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(203.652875 105.706267)">0.3–35 Hz / 100 Hz</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(197.102375 117.56633)">30 s → 3,000 samples</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(190.064437 129.426392)">STFT → 29×89 log power</text>
   </g>
   <g id="text_6">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="74.97" y="202.637495" transform="rotate(-0 74.97 202.637495)">Raw ECG</text>
   </g>
   <g id="text_7">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'; text-anchor: middle" x="74.97" y="228.44633" transform="rotate(-0 74.97 228.44633)">1 channel / offline</text>
   </g>
   <g id="text_8">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="245.16" y="202.598433" transform="rotate(-0 245.16 202.598433)">Beats and history features</text>
   </g>
   <g id="text_9">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(187.87475 216.586267)">SleepECG → RR endpoints</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(173.045375 228.44633)">Up to 300 s ending at epoch end</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(182.477875 240.306392)">26 features + 26 flags + 3 q</text>
   </g>
   <g id="text_10">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="74.97" y="307.973495" transform="rotate(-0 74.97 307.973495)">Expert labels</text>
   </g>
   <g id="text_11">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'; text-anchor: middle" x="74.97" y="333.78233" transform="rotate(-0 74.97 333.78233)">30 s / Wake–REM</text>
   </g>
   <g id="text_12">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="245.16" y="307.934433" transform="rotate(-0 245.16 307.934433)">Mapping and exclusions</text>
   </g>
   <g id="text_13">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(214.118687 321.922267)">MIT 3+4 → N3</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(181.297437 333.78233)">ISRUC scorer 1 / trim final 30</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(178.567375 345.642392)">Unknown labels break context</text>
   </g>
   <g id="text_14">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="448.83" y="151.260992" transform="rotate(-0 448.83 151.260992)">Align; split by subject</text>
   </g>
   <g id="text_15">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(390.1505 186.595276)">18,770 epochs / 26 people</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(410.121 198.455339)">Train: 22 / 15,761</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(417.610625 210.315401)">Test: 4 / 3,009</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(411.661687 222.175464)">No validation set</text>
   </g>
   <g id="text_16">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="644.13" y="151.260992" transform="rotate(-0 644.13 151.260992)">Scaling and contexts</text>
   </g>
   <g id="text_17">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(583.508312 186.595276)">Fit fill/scale on training only</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(586.155187 198.455339)">L=5 or 15 / past + current</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(589.429062 210.315401)">Mask unavailable history</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(591.71775 222.175464)">No cross-record context</text>
   </g>
   <g id="text_18">
    <text style="fill: #20324a; font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="794.79" y="160.225895" transform="rotate(-0 794.79 160.225895)">Model</text>
   </g>
   <g id="text_19">
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(780.97125 185.539867)">A0–A6</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(763.499812 197.39993)">5 probabilities</text>
    <text style="fill: #20324a; font: 8.8px 'DejaVu Sans'" transform="translate(764.654125 209.259992)">Current stage</text>
   </g>
   <g id="text_20">
    <text style="fill: #52667f; font: 10px 'DejaVu Sans'; text-anchor: start" x="370.71" y="319.0464" transform="rotate(-0 370.71 319.0464)">Labels are targets/evaluation references, not model input features</text>
   </g>
  </g>
 </g>
